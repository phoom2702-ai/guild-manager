<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guild Team Manager</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#20242b;
    color:#fff;
    margin:20px;
}
h1{
    text-align:center;
}

.container{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.team{
    background:#2f3645;
    border-radius:12px;
    padding:10px;
}

.team h2{
    text-align:center;
    color:#ffd54f;
}

.members{
    min-height:280px;
}

.member{
    background:#3f4859;
    margin:8px 0;
    padding:10px;
    border-radius:8px;
    cursor:grab;
    user-select:none;
}

.member:active{
    cursor:grabbing;
}

.leader{
    background:#ff9800;
    color:#000;
    font-weight:bold;
}

.drag-over{
    outline:3px dashed #4caf50;
}
</style>
</head>

<body>

<h1>🏰 Guild Team Manager</h1>

<div class="container" id="teams"></div>

<script>

const teams=document.getElementById("teams");

for(let t=1;t<=8;t++){

const team=document.createElement("div");
team.className="team";

team.innerHTML=`
<h2>ทีม ${t}</h2>

<div class="members">
<div class="member leader" draggable="true">👑 Leader ${t}</div>
<div class="member" draggable="true">สมาชิก ${t}-1</div>
<div class="member" draggable="true">สมาชิก ${t}-2</div>
<div class="member" draggable="true">สมาชิก ${t}-3</div>
<div class="member" draggable="true">สมาชิก ${t}-4</div>
</div>
`;

teams.appendChild(team);

}

let dragItem=null;

document.querySelectorAll(".member").forEach(item=>{

item.addEventListener("dragstart",()=>{
dragItem=item;
});

});

document.querySelectorAll(".members").forEach(box=>{

box.addEventListener("dragover",(e)=>{
e.preventDefault();
box.classList.add("drag-over");
});

box.addEventListener("dragleave",()=>{
box.classList.remove("drag-over");
});

box.addEventListener("drop",(e)=>{
e.preventDefault();
box.classList.remove("drag-over");

if(dragItem){
box.appendChild(dragItem);
}
});

});

</script>

</body>
</html>
