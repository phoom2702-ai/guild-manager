<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guild Team Manager</title>

<style>
*{box-sizing:border-box}
body{
    margin:20px;
    font-family:Segoe UI,Tahoma,sans-serif;
    background:#1d2330;
    color:white;
}

h1{
    text-align:center;
}

.pool{
    background:#2f3645;
    padding:15px;
    border-radius:12px;
    margin-bottom:20px;
}

.members{
    min-height:70px;
    border:2px dashed #666;
    padding:10px;
    border-radius:10px;
}

.container{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.team{
    background:#2f3645;
    border-radius:12px;
    padding:10px;
}

.team h3{
    margin:0 0 10px;
    text-align:center;
    color:#FFD54F;
}

.member{
    background:#45506a;
    margin:6px 0;
    padding:10px;
    border-radius:8px;
    cursor:grab;
}

.member:hover{
    background:#5b6b8d;
}

.drag-over{
    border-color:#4CAF50;
}

.full{
    border:2px solid red;
}
</style>

</head>
<body>

<h1>🏰 Guild Team Manager</h1>

<div class="pool">
<h2>รายชื่อสมาชิกทั้งหมด</h2>
<div class="members" id="pool"></div>
</div>

<div class="container" id="teams"></div>

<script>

const names=[
"Alice","Bob","Cat","David","Emma",
"Frank","Grace","Henry","Ice","Jane",
"Ken","Leo","Mint","Neo","Oscar",
"Palm","Queen","Rain","Sky","Tiger",
"Unity","Violet","Wind","Xen","Yuri",
"Zero","Bank","Film","Gun","Hero",
"Jame","Kim","Lucky","Max","Nice",
"Oat","Ping","Rin","Toon","Beam"
];

const pool=document.getElementById("pool");

names.forEach(name=>{
    pool.appendChild(createMember(name));
});

const teams=document.getElementById("teams");

for(let i=1;i<=8;i++){

let team=document.createElement("div");

team.className="team";

team.innerHTML=`
<h3>ทีม ${i} (<span class="count">0</span>/5)</h3>
<div class="members teamBox"></div>
`;

teams.appendChild(team);

}

let dragItem=null;

function createMember(name){

const div=document.createElement("div");

div.className="member";

div.draggable=true;

div.innerText=name;

div.addEventListener("dragstart",()=>{
dragItem=div;
});

return div;

}

function updateCounts(){

document.querySelectorAll(".team").forEach(team=>{

const box=team.querySelector(".teamBox");

const count=box.children.length;

team.querySelector(".count").innerText=count;

if(count>=5)
team.classList.add("full");
else
team.classList.remove("full");

});

}

document.querySelectorAll(".members").forEach(box=>{

box.addEventListener("dragover",e=>{

e.preventDefault();

box.classList.add("drag-over");

});

box.addEventListener("dragleave",()=>{

box.classList.remove("drag-over");

});

box.addEventListener("drop",e=>{

e.preventDefault();

box.classList.remove("drag-over");

const isTeam=box.classList.contains("teamBox");

if(isTeam && box.children.length>=5){

alert("ทีมนี้เต็มแล้ว (5 คน)");

return;

}

box.appendChild(dragItem);

updateCounts();

});

});

updateCounts();

</script>

</body>
</html>
